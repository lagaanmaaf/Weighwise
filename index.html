<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack – Weight Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.0/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 90%; }
    body { font-family: 'Inter', sans-serif; background: #F8FAFB; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
    
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    .slide-up { animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
    
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px) } to { opacity:1; transform:translateY(0) } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes pulse-custom { 0%, 100% { opacity: 1 } 50% { opacity: 0.5 } }
    
    .card-hover { transition: box-shadow 0.2s, transform 0.2s; }
    .card-hover:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); transform: translateY(-2px); }
    
    .btn-primary { background: linear-gradient(135deg,#10B981,#0d9488); color:white; border:none; cursor:pointer; transition: all 0.2s; }
    .btn-primary:hover { background: linear-gradient(135deg,#059669,#0f766e); transform:scale(1.02); }
    .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    
    .nav-active { background: linear-gradient(135deg,#10B981,#0d9488) !important; color:white !important; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
    .progress-bar { transition: width 1.2s cubic-bezier(0.22,1,0.36,1); }
    .modal-overlay { animation: fadeIn 0.2s ease; }
    .modal-box { animation: slideUp 0.3s cubic-bezier(0.22,1,0.36,1); }
    
    .day-btn { transition: all 0.2s; }
    .day-btn.active { background: linear-gradient(135deg,#f97316,#ea580c); color:white; transform:scale(1.05); box-shadow:0 4px 10px rgba(249,115,22,0.3); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @media(max-width:1024px){ 
      .sidebar { display: none !important; } 
      .main-content { margin-left: 0 !important; padding-bottom: 90px !important; }
      .mobile-nav { display: flex !important; }
    }
  </style>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { inter: ['Inter','sans-serif'] } } }
    }
  </script>
</head>
<body>
<div id="root"></div>

const saveEntries = v => localStorage.setItem(ENTRIES_KEY, JSON.stringify(v));
const getGoal = () => JSON.parse(localStorage.getItem(GOAL_KEY) || 'null');

const uid = () => Math.random().toString(36).slice(2);

const fmt = (d, f) => {
  const dt = typeof d === 'string' ? new Date(d + 'T00:00:00') : d;
  const pad = n => String(n).padStart(2,'0');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const fullMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  if (f==='MMM d') return `${months[dt.getMonth()]} ${dt.getDate()}`;
  if (f==='MMM d, yyyy') return `${months[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
  if (f==='MMMM d, yyyy') return `${fullMonths[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
  if (f==='EEE, MMM d') return `${days[dt.getDay()]}, ${months[dt.getMonth()]} ${dt.getDate()}`;
  if (f==='EEEE, MMMM d, yyyy') return `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()]}, ${fullMonths[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
  if (f==='dd') return pad(dt.getDate());
  if (f==='MMM') return months[dt.getMonth()];
  if (f==='yyyy-MM-dd') return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  if (f==='MMM d, yy') return `${months[dt.getMonth()]} ${dt.getDate()}, ${String(dt.getFullYear()).slice(2)}`;
  return dt.toLocaleDateString();
};
const today = () => fmt(new Date(),'yyyy-MM-dd');
const parseDate = s => new Date(s + 'T00:00:00');
const diffDays = (a,b) => Math.round((parseDate(b)-parseDate(a))/(1000*60*60*24));
const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const eachDay = (start,end) => {
  const days=[], s=parseDate(start), e=typeof end==='string'?parseDate(end):end;
  for(let d=new Date(s); d<=e; d=addDays(d,1)) days.push(fmt(d,'yyyy-MM-dd'));
  return days;
};
const startOfWeek = d => { const dt=parseDate(d); const day=dt.getDay(); const diff=dt.getDate()-(day===0?6:day-1); dt.setDate(diff); return fmt(dt,'MMM d'); };
const dayName = d => ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][parseDate(d).getDay()];

const Ic = ({name, size=18, cls=""}) => (
  <span style={{width:size,height:size,display:'inline-flex',flexShrink:0}} className={cls}>
    {React.cloneElement(Icon[name], {style:{width:size,height:size}})}
  </span>

const colorMap = {
  emerald:{bg:'#ECFDF5',icon:'#059669'}, violet:{bg:'#F5F3FF',icon:'#7C3AED'},
  blue:{bg:'#EFF6FF',icon:'#2563EB'}, orange:{bg:'#FFF7ED',icon:'#EA580C'},
  red:{bg:'#FEF2F2',icon:'#EF4444'},
};

function StatCard({title,value,unit,iconName,color='emerald',subtitle,delay=0}){
  const [disp,setDisp] = useState(0);
  const c = colorMap[color]||colorMap.emerald;
  useEffect(()=>{
    if(typeof value!=='number'){setDisp(value);return;}
    let f=0;
    const timer=setInterval(()=>{
      f++;
      const p=f/50;
      const e=1-Math.pow(1-p,3);
      setDisp(parseFloat((value*e).toFixed(1)));
      if(f>=50){clearInterval(timer);setDisp(value);}
    },800/50);
    return()=>clearInterval(timer);
  },[value]);
  
  return(
    <div className="card-hover slide-up bg-white rounded-2xl border border-gray-100 p-4 sm:p-5 lg:p-6 cursor-default flex flex-col justify-between" style={{animationDelay:`${delay}s`}}>
      <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center mb-3 sm:mb-4" style={{background:c.bg,color:c.icon}}>
        <Ic name={iconName} size={20} cls="sm:w-[22px] sm:h-[22px]"/>
      </div>
      <div className="flex items-baseline gap-1.5">
        <span className="text-2xl sm:text-3xl font-bold text-gray-900 tabular-nums">{disp}</span>
        {unit&&<span className="text-sm sm:text-base text-gray-400 font-medium">{unit}</span>}
      </div>
      <p className="text-sm sm:text-base font-bold text-gray-600 mt-1 leading-tight truncate">{title}</p>
      {subtitle&&<p className="text-xs sm:text-sm text-gray-400 mt-1.5 truncate">{subtitle}</p>}
    </div>
  );
}

function WeightLogModal({entry, defaultDate, onClose, onSaved}){
  const [form,setForm]=useState({
    date:entry?.date || defaultDate || today(),
    preGymWeight:entry?.preGymWeight||'',
    postGymWeight:entry?.postGymWeight||'',
    note:entry?.note||'',
  });
  
  const delta = form.preGymWeight&&form.postGymWeight ? parseFloat((parseFloat(form.postGymWeight)-parseFloat(form.preGymWeight)).toFixed(2)) : null;
  
  const handleSave=()=>{
    if(!form.preGymWeight)return;
    const entries=getEntries();
    const data={
      id:entry?.id||uid(),
      date:form.date,
      preGymWeight:parseFloat(form.preGymWeight),
      postGymWeight:form.postGymWeight?parseFloat(form.postGymWeight):null,
      note:form.note||null,
    };
    if(entry){
      saveEntries(entries.map(e=>e.id===entry.id?data:e));
    } else {
      saveEntries([...entries,data]);
    }
    onSaved();
  };
  
  return(
    <div className="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{background:'rgba(0,0,0,0.5)',backdropFilter:'blur(4px)'}}
      onClick={onClose}>
      <div className="modal-box bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden"
        onClick={e=>e.stopPropagation()}>
        <div style={{background:'linear-gradient(135deg,#10B981,#0d9488)'}} className="p-6 sm:p-8 pb-5">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-xl flex items-center justify-center" style={{background:'rgba(255,255,255,0.2)',color:'white'}}>
                <Ic name="scale" size={24}/>
              </div>
              <div>
                <h2 className="text-xl sm:text-2xl font-bold text-white">{entry?'Edit Entry':'Log Weight'}</h2>
                <p className="text-sm sm:text-base" style={{color:'rgba(255,255,255,0.75)'}}>Track your progress</p>
              </div>
            </div>
            <button onClick={onClose} className="p-3 rounded-xl text-white transition-colors"
              style={{background:'rgba(255,255,255,0.2)'}}><Ic name="x" size={20}/></button>
          </div>
        </div>
        <div className="p-6 sm:p-8 space-y-5">
          <div>
            <label className="text-xs sm:text-sm font-bold text-gray-500 uppercase tracking-wide mb-2 block">Date</label>
            <input type="date" value={form.date}
              onChange={e=>setForm(f=>({...f,date:e.target.value}))}
              className="w-full border border-gray-200 rounded-2xl px-5 py-3.5 sm:py-4 text-base font-bold focus:outline-none transition-all"
              style={{borderColor:'#e5e7eb'}}
              onFocus={e=>e.target.style.borderColor='#10B981'}
              onBlur={e=>e.target.style.borderColor='#e5e7eb'}
            />
          </div>
          <div className="grid grid-cols-2 gap-4 sm:gap-5">
            <div>
              <label className="text-xs sm:text-sm font-bold text-gray-500 uppercase tracking-wide mb-2 block">Pre-Gym <span style={{color:'#EF4444'}}>*</span></label>
              <div className="relative">
                <input type="number" step="0.1" placeholder="0.0" value={form.preGymWeight}
                  onChange={e=>setForm(f=>({...f,preGymWeight:e.target.value}))}
                  className="w-full border border-gray-200 rounded-2xl px-5 py-3.5 sm:py-4 text-base font-bold focus:outline-none transition-all pr-10"
                  onFocus={e=>e.target.style.borderColor='#10B981'}
                  onBlur={e=>e.target.style.borderColor='#e5e7eb'}
                />
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm sm:text-base text-gray-400 font-bold">kg</span>
              </div>
            </div>
            <div>
              <label className="text-xs sm:text-sm font-bold text-gray-500 uppercase tracking-wide mb-2 block">Post-Gym <span className="text-gray-300 font-normal">opt.</span></label>
              <div className="relative">
                <input type="number" step="0.1" placeholder="0.0" value={form.postGymWeight}
                  onChange={e=>setForm(f=>({...f,postGymWeight:e.target.value}))}
                  className="w-full border border-gray-200 rounded-2xl px-5 py-3.5 sm:py-4 text-base font-bold focus:outline-none transition-all pr-10"
                  onFocus={e=>e.target.style.borderColor='#10B981'}
                  onBlur={e=>e.target.style.borderColor='#e5e7eb'}
                />
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm sm:text-base text-gray-400 font-bold">kg</span>
              </div>
            </div>
          </div>
          {delta!==null&&(
            <div className="rounded-2xl px-5 py-4 sm:py-5 flex items-center justify-between" style={{background:'#ECFDF5'}}>
              <div className="flex items-center gap-2" style={{color:'#059669'}}>
                <Ic name="dumbbell" size={18}/>
                <span className="text-sm font-bold">Session Delta</span>
              </div>
              <span className="text-lg font-extrabold" style={{color:delta<0?'#059669':'#EA580C'}}>
                {delta>0?'+':''}{delta} kg
              </span>
            </div>

function getMissedDays(goal, entries){
  if(!goal?.startDate) return [];
  const todayStr=today();
  if(goal.startDate>todayStr) return [];
  const allDays=eachDay(goal.startDate,todayStr);
  const entryDates=new Set(entries.map(e=>e.date));
  const restDays=goal.restDays||[];
  const ignored=goal.ignoredDays||[];
  return allDays.filter(d=>{
    if(d===todayStr) return false;
    if(restDays.includes(dayName(d))) return false;
    if(ignored.includes(d)) return false;
    return !entryDates.has(d);
  });
}

function getStreak(goal,entries){
  if(!entries.length) return 0;
  const restDays=goal?.restDays||[];
  let streak=0;
  let d=new Date();
  for(let i=0;i<365;i++){
    const ds=fmt(d,'yyyy-MM-dd');
    const dn=dayName(ds);
    if(restDays.includes(dn)){d=addDays(d,-1);continue;}
    if(entries.some(e=>e.date===ds)){
      streak++;
    } else {
      if(i>0) break;
    }
    d=addDays(d,-1);
  }
  return streak;
}

              onMouseLeave={e=>{e.target.style.background='white';}}>
              <Ic name="trash" size={16}/>Delete All

          )}
          <button onClick={()=>{setEditEntry(null);setShowModal(true);}}
            className="btn-primary flex items-center gap-1.5 px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap"
            style={{boxShadow:'0 4px 12px rgba(16,185,129,0.3)'}}>
            <Ic name="plus" size={16}/>Add Entry

            <Ic name="dumbbell" size={36}/>
          </div>
          <p className="font-bold text-gray-700 text-xl mb-2">No entries yet</p>
          <p className="text-sm font-semibold text-gray-400 mb-6 max-w-xs">Start logging your daily weight to build your fitness story</p>
          <button onClick={()=>setShowModal(true)} className="btn-primary rounded-2xl px-6 py-3.5 text-sm font-bold flex items-center gap-2 whitespace-nowrap">
            <Ic name="plus" size={18}/>Add First Entry
          </button>
        </div>
      ):(
        <div>
          {entries.map((entry,i)=>{
            const isAfterStart=goal?.startDate&&entry.date>=goal.startDate;
            const dayNumber=isAfterStart?diffDays(goal.startDate,entry.date)+1:null;
            const diff=entry.postGymWeight&&entry.preGymWeight?(entry.postGymWeight-entry.preGymWeight):null;
            const isStartDay=goal?.startDate&&entry.date===goal.startDate;
            const prevEntry=entries[i-1];
            const showDivider=goal?.startDate&&prevEntry&&prevEntry.date>=goal.startDate&&entry.date<goal.startDate;
            return(
              <div key={entry.id}>
                {showDivider&&(
                  <div className="flex flex-row items-center gap-3 my-5 flex-nowrap overflow-hidden">
                    <div className="h-px flex-1 min-w-[20px]" style={{background:'linear-gradient(to right,transparent,#DDD6FE)'}}/>
                    <div className="flex items-center gap-2 px-4 py-1.5 rounded-full border text-xs sm:text-sm font-bold whitespace-nowrap flex-shrink-0" style={{background:'#F5F3FF',borderColor:'#DDD6FE',color:'#6D28D9'}}>
                      <Ic name="flag" size={14}/>Journey began {fmt(goal.startDate,'MMM d, yyyy')}
                    </div>
                    <div className="h-px flex-1 min-w-[20px]" style={{background:'linear-gradient(to left,transparent,#DDD6FE)'}}/>
                  </div>
                )}
                <div className={`bg-white rounded-3xl border p-4 sm:p-6 flex flex-row items-center gap-4 mb-3 transition-all group flex-nowrap`}
                  style={{borderColor:isStartDay?'#DDD6FE':'#F3F4F6',background:isStartDay?'#FAFAF9':'white'}}>
                  <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl flex flex-col items-center justify-center flex-shrink-0"
                    style={{background:isAfterStart?'linear-gradient(135deg,#34D399,#059669)':'#F3F4F6',boxShadow:isAfterStart?'0 4px 12px rgba(16,185,129,0.2)':'none'}}>
                    <span className="text-[11px] sm:text-xs font-bold uppercase" style={{color:isAfterStart?'rgba(255,255,255,0.8)':'#9CA3AF'}}>{fmt(entry.date,'MMM')}</span>
                    <span className="text-lg sm:text-xl font-extrabold leading-tight" style={{color:isAfterStart?'white':'#4B5563'}}>{fmt(entry.date,'dd')}</span>
                  </div>
                  <div className="flex-1 min-w-0 overflow-hidden">
                    <div className="flex flex-row items-center gap-2 flex-nowrap overflow-x-auto no-scrollbar pb-0.5">
                      <span className="text-base sm:text-lg font-bold text-gray-900 whitespace-nowrap">{fmt(entry.date,'EEE, MMM d, yyyy')}</span>
                      {dayNumber&&<span className="text-[11px] px-2 py-0.5 rounded-full font-bold whitespace-nowrap flex-shrink-0" style={{background:'#D1FAE5',color:'#065F46'}}>Day {dayNumber}</span>}
                      {isStartDay&&<span className="text-[11px] px-2 py-0.5 rounded-full font-bold whitespace-nowrap flex-shrink-0" style={{background:'#EDE9FE',color:'#5B21B6'}}>🚀 Start</span>}
                    </div>
                    <div className="flex flex-row items-center gap-x-2 gap-y-1 mt-1 flex-wrap">
                      <span className="text-sm font-semibold text-gray-600 whitespace-nowrap">Pre: <strong className="text-gray-900">{entry.preGymWeight} kg</strong></span>
                      {entry.postGymWeight&&<>
                        <span className="text-gray-300 hidden sm:inline">·</span>
                        <span className="text-sm font-semibold text-gray-600 whitespace-nowrap">Post: <strong className="text-gray-900">{entry.postGymWeight} kg</strong></span>
                        {diff!==null&&<span className="text-xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap" style={{background:diff<0?'#D1FAE5':'#FEF3C7',color:diff<0?'#065F46':'#92400E'}}>{diff>0?'+':''}{parseFloat(diff.toFixed(2))} kg</span>}
                      </>}
                    </div>
                    {entry.note&&<p className="text-xs sm:text-sm font-semibold text-gray-400 mt-2 italic truncate max-w-full">"{entry.note}"</p>}
                  </div>
                  <div className="flex flex-row items-center gap-1.5 flex-shrink-0 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-nowrap">
                    <button onClick={()=>{setEditEntry(entry);setShowModal(true);}}
                      className="p-2 sm:p-2.5 rounded-xl transition-all" style={{color:'#9CA3AF'}}
                      onMouseEnter={e=>{e.currentTarget.style.background='#ECFDF5';e.currentTarget.style.color='#059669';}}
                      onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='#9CA3AF';}}>
                      <Ic name="edit" size={18}/>
                    </button>
                    <button onClick={()=>setDeleteConfirm(entry.id)}
                      className="p-2 sm:p-2.5 rounded-xl transition-all" style={{color:'#9CA3AF'}}
                      onMouseEnter={e=>{e.currentTarget.style.background='#FEF2F2';e.currentTarget.style.color='#EF4444';}}
                      onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='#9CA3AF';}}>
                      <Ic name="trash" size={18}/>
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
          {goal?.startDate&&entries.length>0&&entries[entries.length-1]?.date>=goal.startDate&&(
            <div className="flex flex-row items-center gap-3 mt-5 py-2 flex-nowrap">
              <div className="h-px flex-1 min-w-[20px]" style={{background:'linear-gradient(to right,transparent,#DDD6FE)'}}/>
              <div className="flex items-center gap-2 px-4 py-2 rounded-full border text-xs sm:text-sm font-bold whitespace-nowrap flex-shrink-0" style={{background:'#F5F3FF',borderColor:'#DDD6FE',color:'#6D28D9'}}>
                <Ic name="flag" size={14}/>Journey started {fmt(goal.startDate,'MMM d, yyyy')}
              </div>
              <div className="h-px flex-1 min-w-[20px]" style={{background:'linear-gradient(to left,transparent,#DDD6FE)'}}/>

      )}

      {deleteConfirm&&<DeleteConfirm isAll={deleteConfirm==='all'} onCancel={()=>setDeleteConfirm(null)} onConfirm={()=>deleteConfirm==='all'?handleDeleteAll():handleDelete(deleteConfirm)}/>}
      {showModal&&<WeightLogModal entry={editEntry} onClose={()=>{setShowModal(false);setEditEntry(null);}} onSaved={()=>{setShowModal(false);setEditEntry(null);load();}}/>}
    </div>
  );
}

// ── ANALYTICS ────────────────────────────────────────────────────────────────
const TT = ({active,payload,label}) => {
  if(!active||!payload?.length) return null;
  return(
    <div className="bg-white border border-gray-100 rounded-2xl shadow-xl p-3 text-xs sm:text-sm">
      <p className="font-bold text-gray-700 mb-2 truncate">{label}</p>
      {payload.map((p,i)=>(
        <div key={i} className="flex flex-row items-center gap-2 mb-1 flex-nowrap">
          <div className="w-2 h-2 rounded-full flex-shrink-0" style={{background:p.color}}/>
          <span className="text-gray-600 whitespace-nowrap font-semibold">{p.name}:</span>
          <span className="font-extrabold text-gray-900 whitespace-nowrap">{p.value} kg</span>
        </div>
      ))}
    </div>
  );
};

function Analytics(){
  const [entries,setEntries]=useState([]);
  const [goal,setGoal]=useState(null);
  const [height,setHeight]=useState('');
  
  useEffect(()=>{
    const e=[...getEntries()].sort((a,b)=>a.date.localeCompare(b.date));
    setEntries(e);
    const g=getGoal();
    setGoal(g);
    if(g?.height) setHeight(String(g.height));
  },[]);

  if(entries.length<2) return(
    <div className="flex flex-col items-center justify-center min-h-screen p-5 text-center">
      <div className="w-24 h-24 rounded-3xl flex items-center justify-center mb-6" style={{background:'#F5F3FF',color:'#7C3AED'}}>
        <Ic name="chart" size={40}/>
      </div>
      <p className="font-bold text-gray-700 text-xl mb-2">Not enough data</p>
      <p className="text-sm font-semibold text-gray-400 max-w-xs">Log at least 2 weight entries to unlock analytics</p>
    </div>
  );

  const chartData=entries.map(e=>({
    date:fmt(e.date,'MMM d'),
    pre:e.preGymWeight,
    post:e.postGymWeight||null,
    delta:e.postGymWeight!=null?parseFloat((e.postGymWeight-e.preGymWeight).toFixed(2)):null,
  }));

  const weeklyMap={};
  entries.forEach(e=>{
    const w=startOfWeek(e.date);
    if(!weeklyMap[w]) weeklyMap[w]={weights:[],count:0};
    weeklyMap[w].weights.push(e.preGymWeight);
    weeklyMap[w].count++;
  });
  const weeklyData=Object.entries(weeklyMap).map(([week,d])=>({
    week,
    avg:parseFloat((d.weights.reduce((a,b)=>a+b,0)/d.weights.length).toFixed(1)),
    sessions:d.count,
  }));

  const n=entries.length;
  const xV=entries.map((_,i)=>i);
  const yV=entries.map(e=>e.preGymWeight);
  const sx=xV.reduce((a,b)=>a+b,0),sy=yV.reduce((a,b)=>a+b,0);
  const sxy=xV.reduce((s,xi,i)=>s+xi*yV[i],0),sx2=xV.reduce((s,xi)=>s+xi*xi,0);
  const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx);
  const intercept=(sy-slope*sx)/n;

  const first=entries[0],last=entries[entries.length-1];
  const totalChange=parseFloat((last.preGymWeight-first.preGymWeight).toFixed(1));
  const dspan=Math.max(1,diffDays(first.date,last.date));
  const weeklyRate=parseFloat((totalChange/dspan*7).toFixed(2));

  const deltaEntries=entries.filter(e=>e.postGymWeight!=null);
  const avgDelta=deltaEntries.length>0?parseFloat((deltaEntries.reduce((s,e)=>s+(e.postGymWeight-e.preGymWeight),0)/deltaEntries.length).toFixed(2)):null;

  const sortedW=[...weeklyData].sort((a,b)=>a.avg-b.avg);
  const bestW=sortedW[0],worstW=sortedW[sortedW.length-1];

  const missedCount=getMissedDays(goal,entries).length;

  const projDays=goal?.targetWeight&&slope!==0?Math.round((goal.targetWeight-intercept)/slope):null;
  const projDate=projDays!==null&&projDays>entries.length?fmt(addDays(parseDate(first.date),projDays),'MMM d, yyyy'):null;

  const cw=last.preGymWeight;
  const bmi=height?parseFloat((cw/((parseFloat(height)/100)**2)).toFixed(1)):null;
  const bmiCat=bmi?(bmi<18.5?{label:'Underweight',color:'#3B82F6',bg:'#EFF6FF'}:bmi<25?{label:'Normal Weight',color:'#059669',bg:'#ECFDF5'}:bmi<30?{label:'Overweight',color:'#EA580C',bg:'#FFF7ED'}:{label:'Obese',color:'#EF4444',bg:'#FEF2F2'}):null;

  const stats=[
    {label:'Total Change',value:`${totalChange>0?'+':''}${totalChange} kg`,icon:'trendDown',bg:'#ECFDF5',ic:'#059669'},
    {label:'Weekly Rate',value:`${weeklyRate>0?'+':''}${weeklyRate} kg/wk`,icon:'zap',bg:'#F5F3FF',ic:'#7C3AED'},
    {label:'Avg Delta',value:avgDelta!=null?`${avgDelta>0?'+':''}${avgDelta} kg`:'—',icon:'award',bg:'#EFF6FF',ic:'#2563EB'},
    {label:'Goal Done',value:projDate||'—',icon:'target',bg:'#ECFDF5',ic:'#059669'},
    {label:'Missed Days',value:`${missedCount}`,icon:'alert',bg:missedCount>0?'#FFF7ED':'#ECFDF5',ic:missedCount>0?'#EA580C':'#059669'},
    {label:'Sessions',value:`${entries.length}`,icon:'flame',bg:'#FFF7ED',ic:'#EA580C'},
  ];

  return(
    <div className="p-4 sm:p-5 lg:p-8 max-w-6xl mx-auto space-y-5 sm:space-y-6">
      <div className="slide-up">
        <h1 className="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Analytics</h1>
        <p className="text-xs sm:text-sm font-semibold text-gray-400 mt-1">Deep insights into your fitness journey</p>
      </div>
      {/* Stats grid */}
      <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5">
        {stats.map((s,i)=>(
          <div key={i} className="card-hover slide-up bg-white rounded-3xl border border-gray-100 p-4 sm:p-6 flex flex-col justify-between"
            style={{animationDelay:`${i*0.05}s`}}>
            <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center mb-3 sm:mb-4 flex-shrink-0" style={{background:s.bg,color:s.ic}}>
              <Ic name={s.icon} size={20}/>
            </div>
            {/* Goal Done needs special treatment — no truncation, wrap allowed */}
            {s.label === 'Goal Done' ? (
              <p className="text-lg sm:text-xl font-extrabold text-gray-900 leading-tight break-words">{s.value}</p>
            ) : (
              <p className="text-2xl sm:text-3xl font-extrabold text-gray-900 whitespace-nowrap truncate">{s.value}</p>
            )}
            <p className="text-xs sm:text-sm text-gray-500 mt-1 font-bold truncate">{s.label}</p>
          </div>
        ))}
      </div>

      {/* Weight over time */}
      <div className="bg-white rounded-3xl border border-gray-100 p-5 lg:p-6 shadow-sm slide-up overflow-x-auto no-scrollbar" style={{animationDelay:'0.2s'}}>
        <div className="min-w-[500px]">
          <h3 className="text-lg font-bold text-gray-900 mb-1">Weight Over Time</h3>
          <p className="text-sm font-semibold text-gray-400 mb-5">Pre-gym and post-gym weight trend</p>
          <ResponsiveContainer width="100%" height={280}>
            <AreaChart data={chartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
              <defs>
                <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor="#10B981" stopOpacity={0.15}/>
                  <stop offset="95%" stopColor="#10B981" stopOpacity={0}/>
                </linearGradient>
                <linearGradient id="pog" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor="#7C3AED" stopOpacity={0.1}/>
                  <stop offset="95%" stopColor="#7C3AED" stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" stroke="#F1F5F9" vertical={false}/>
              <XAxis dataKey="date" tick={{fontSize:12,fontWeight:600,fill:'#94A3B8'}} tickLine={false} axisLine={false}/>
              <YAxis tick={{fontSize:12,fontWeight:600,fill:'#94A3B8'}} tickLine={false} axisLine={false} domain={['auto','auto']} width={40}/>
              <Tooltip content={<TT/>}/>
              <Legend wrapperStyle={{fontSize:'12px',fontWeight:'bold',paddingTop:'10px'}}/>
              <Area type="monotone" dataKey="pre" stroke="#10B981" strokeWidth={3} fill="url(#pg)" name="Pre-Gym" dot={{r:3,fill:'#10B981',strokeWidth:0}} activeDot={{r:6,strokeWidth:0}}/>
              <Area type="monotone" dataKey="post" stroke="#7C3AED" strokeWidth={3} fill="url(#pog)" name="Post-Gym" dot={{r:3,fill:'#7C3AED',strokeWidth:0}} activeDot={{r:6,strokeWidth:0}} connectNulls={false}/>
              {goal?.targetWeight&&<ReferenceLine y={goal.targetWeight} stroke="#F59E0B" strokeDasharray="6 4" strokeWidth={2} label={{value:`Target`,position:'insideTopRight',fontSize:11,fontWeight:'bold',fill:'#F59E0B'}}/>}
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Best / Worst week */}
      <div className="grid grid-cols-2 gap-3 sm:gap-5 slide-up" style={{animationDelay:'0.4s'}}>
        <div className="rounded-3xl p-5 sm:p-6 border flex flex-col justify-center" style={{background:'linear-gradient(135deg,#ECFDF5,#D1FAE5)',borderColor:'#A7F3D0'}}>
          <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-4" style={{background:'#D1FAE5',color:'#059669'}}>
            <Ic name="award" size={22}/>
          </div>
          <p className="text-xs font-bold uppercase tracking-wide mb-1 truncate" style={{color:'#059669'}}>Lowest Week</p>
          <p className="text-3xl font-extrabold truncate" style={{color:'#065F46'}}>{bestW?.avg} <span className="text-base font-bold">kg</span></p>
          <p className="text-xs mt-1.5 font-bold truncate" style={{color:'#059669'}}>Wk of {bestW?.week} &middot; {weeklyData.find(w=>w.week===bestW?.week)?.sessions} sesh</p>
        </div>
        <div className="rounded-3xl p-5 sm:p-6 border flex flex-col justify-center" style={{background:'linear-gradient(135deg,#FFF7ED,#FEF3C7)',borderColor:'#FDE68A'}}>
          <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-4" style={{background:'#FEF3C7',color:'#EA580C'}}>
            <Ic name="trendUp" size={22}/>
          </div>
          <p className="text-xs font-bold uppercase tracking-wide mb-1 truncate" style={{color:'#EA580C'}}>Highest Week</p>
          <p className="text-3xl font-extrabold truncate" style={{color:'#9A3412'}}>{worstW?.avg} <span className="text-base font-bold">kg</span></p>
          <p className="text-xs mt-1.5 font-bold truncate" style={{color:'#EA580C'}}>Wk of {worstW?.week} &middot; {weeklyData.find(w=>w.week===worstW?.week)?.sessions} sesh</p>
        </div>
      </div>

      {/* BMI */}
      <div className="bg-white rounded-3xl border border-gray-100 p-5 lg:p-8 shadow-sm slide-up" style={{animationDelay:'0.45s'}}>
        <h3 className="text-lg font-bold text-gray-900 mb-1">BMI Calculator</h3>
        <p className="text-sm font-semibold text-gray-400 mb-5">Enter your height to calculate current BMI</p>
        <div className="flex flex-row items-end gap-4 flex-nowrap overflow-x-auto no-scrollbar pb-4">
          <div className="flex-1 min-w-[150px]">
            <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block">Height</label>
            <div className="relative">
              <input type="number" placeholder="170" value={height} onChange={e=>setHeight(e.target.value)}
                className="w-full border border-gray-200 rounded-2xl px-5 py-4 text-base font-bold focus:outline-none transition-all pr-12"
                onFocus={e=>e.target.style.borderColor='#10B981'}
                onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
              <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-400 font-bold">cm</span>
            </div>
          </div>
          {bmi&&bmiCat&&(
            <div className="rounded-2xl p-4 sm:p-5 text-center flex-1 min-w-[150px]" style={{background:bmiCat.bg}}>
              <p className="text-4xl font-extrabold truncate" style={{color:bmiCat.color}}>{bmi}</p>
              <p className="text-sm font-bold mt-1 truncate" style={{color:bmiCat.color}}>{bmiCat.label}</p>
              <p className="text-xs text-gray-500 font-semibold mt-1 truncate">{cw} kg</p>
            </div>
          )}
        </div>
        {bmi&&(
          <div className="mt-6 sm:mt-8 flex flex-row gap-2.5 flex-nowrap overflow-x-auto no-scrollbar pb-2 pt-1">
            {[
              {r:'<18.5',l:'Under',bg:'#DBEAFE',c:'#1D4ED8',a:bmi<18.5},
              {r:'18.5-24.9',l:'Normal',bg:'#D1FAE5',c:'#065F46',a:bmi>=18.5&&bmi<25},
              {r:'25-29.9',l:'Over',bg:'#FED7AA',c:'#9A3412',a:bmi>=25&&bmi<30},
              {r:'30+',l:'Obese',bg:'#FECACA',c:'#991B1B',a:bmi>=30},
            ].map(cat=>(
              <div key={cat.l} className="flex flex-row items-center gap-2 text-xs px-3 py-2 rounded-full font-bold transition-all whitespace-nowrap flex-shrink-0"
                style={{background:cat.bg,color:cat.c,opacity:cat.a?1:0.4,outline:cat.a?`2px solid ${cat.c}`:'none',outlineOffset:'1px'}}>
                <span>{cat.r}</span><span style={{opacity:0.6}}>·</span><span>{cat.l}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── SETTINGS ─────────────────────────────────────────────────────────────────
const DAYS=[
  {value:'monday',label:'Mon'},{value:'tuesday',label:'Tue'},{value:'wednesday',label:'Wed'},
  {value:'thursday',label:'Thu'},{value:'friday',label:'Fri'},{value:'saturday',label:'Sat'},{value:'sunday',label:'Sun'},
];

function Settings(){
  const [form,setForm]=useState({startDate:'',endDate:'',targetWeight:'',restDays:['saturday','sunday'],height:''});
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  
  useEffect(()=>{
    const g=getGoal();
    if(g) setForm({startDate:g.startDate||'',endDate:g.endDate||'',targetWeight:g.targetWeight||'',restDays:g.restDays||['saturday','sunday'],height:g.height||''});
  },[]);

  const toggleDay=d=>setForm(f=>({...f,restDays:f.restDays.includes(d)?f.restDays.filter(x=>x!==d):[...f.restDays,d]}));

  const handleSave=()=>{
    setSaving(true);
    saveGoal({startDate:form.startDate||null,endDate:form.endDate||null,targetWeight:form.targetWeight?parseFloat(form.targetWeight):null,restDays:form.restDays,height:form.height?parseFloat(form.height):null});
    setTimeout(()=>{setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),3000);},400);
  };

  const inputCls="w-full border border-gray-200 rounded-2xl px-5 py-4 text-base font-bold focus:outline-none transition-all";
  const focusStyle={borderColor:'#10B981'};

  return(
    <div className="p-4 sm:p-5 lg:p-8 max-w-2xl mx-auto">
      <div className="slide-up mb-8">
        <h1 className="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Settings</h1>
        <p className="text-sm font-semibold text-gray-400 mt-1">Customize your fitness journey</p>
      </div>
      <div className="space-y-6">
        <div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden slide-up" style={{animationDelay:'0.05s'}}>
          <div className="flex flex-row items-center gap-3 px-5 sm:px-8 py-5 border-b border-gray-50 flex-nowrap">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style={{background:'#ECFDF5',color:'#059669'}}><Ic name="calendar" size={20}/></div>
            <div className="min-w-0">
              <h2 className="font-bold text-gray-900 text-base truncate">Journey Period</h2>
              <p className="text-xs font-semibold text-gray-400 mt-0.5 truncate">Set your start and optional end date</p>
            </div>
          </div>
          <div className="px-5 sm:px-8 py-6 grid grid-cols-2 gap-4 sm:gap-5">
            <div className="min-w-0">
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">Start Date</label>
              <input type="date" value={form.startDate} onChange={e=>setForm(f=>({...f,startDate:e.target.value}))}
                className={inputCls} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
            </div>
            <div className="min-w-0">
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">End Date <span className="text-gray-300 font-normal normal-case">(opt.)</span></label>
              <input type="date" value={form.endDate} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))}
                className={inputCls} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
            </div>
          </div>
        </div>

        <div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden slide-up" style={{animationDelay:'0.1s'}}>
          <div className="flex flex-row items-center gap-3 px-5 sm:px-8 py-5 border-b border-gray-50 flex-nowrap">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style={{background:'#F5F3FF',color:'#7C3AED'}}><Ic name="target" size={20}/></div>
            <div className="min-w-0">
              <h2 className="font-bold text-gray-900 text-base truncate">Goals</h2>
              <p className="text-xs font-semibold text-gray-400 mt-0.5 truncate">Target weight and height for BMI</p>
            </div>
          </div>
          <div className="px-5 sm:px-8 py-6 grid grid-cols-2 gap-4 sm:gap-5">
            <div className="min-w-0">
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">Target Weight</label>
              <div className="relative">
                <input type="number" step="0.1" placeholder="e.g. 70" value={form.targetWeight}
                  onChange={e=>setForm(f=>({...f,targetWeight:e.target.value}))}
                  className={inputCls+" pr-10 sm:pr-12"} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs sm:text-sm text-gray-400 font-bold">kg</span>
              </div>
            </div>
            <div className="min-w-0">
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">Height</label>
              <div className="relative">
                <input type="number" placeholder="e.g. 170" value={form.height}
                  onChange={e=>setForm(f=>({...f,height:e.target.value}))}
                  className={inputCls+" pr-10 sm:pr-12"} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs sm:text-sm text-gray-400 font-bold">cm</span>
              </div>
            </div>
          </div>
        </div>

        <div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden slide-up" style={{animationDelay:'0.15s'}}>
          <div className="flex flex-row items-center gap-3 px-5 sm:px-8 py-5 border-b border-gray-50 flex-nowrap">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style={{background:'#FFF7ED',color:'#EA580C'}}><Ic name="coffee" size={20}/></div>
            <div className="min-w-0">
              <h2 className="font-bold text-gray-900 text-base truncate">Rest Days</h2>
              <p className="text-xs font-semibold text-gray-400 mt-0.5 truncate">These days won't count as missed</p>
            </div>
          </div>
          <div className="px-5 sm:px-8 py-6 overflow-x-auto no-scrollbar">
            <div className="flex gap-2.5 min-w-max">
              {DAYS.map(({value,label})=>(
                <button key={value} type="button" onClick={()=>toggleDay(value)}
                  className={`day-btn flex-1 min-w-[56px] sm:min-w-[64px] py-3.5 sm:py-4 rounded-2xl text-xs sm:text-sm font-bold ${form.restDays.includes(value)?'active':''}`}
                  style={!form.restDays.includes(value)?{background:'#F9FAFB',color:'#6B7280'}:{}}>
                  {label}
                </button>
              ))}
            </div>
            <p className="text-xs font-semibold text-gray-400 mt-4 truncate">
              {form.restDays.length===0?'⚡ No rest days — every day counts!':
                `☕ ${form.restDays.length} rest ${form.restDays.length===1?'day':'days'} selected`}
            </p>
          </div>
        </div>

        <button onClick={handleSave} disabled={saving}
          className={`btn-primary w-full h-14 sm:h-16 rounded-2xl font-bold text-base sm:text-lg flex items-center justify-center gap-2 slide-up whitespace-nowrap`}
          style={{animationDelay:'0.2s',boxShadow:'0 8px 24px rgba(16,185,129,0.3)',background:saved?'#059669':''}}>
          {saving?(
            <><div style={{width:20,height:20,border:'2px solid rgba(255,255,255,0.4)',borderTop:'2px solid white',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/> Saving…</>
          ):saved?(
            <><Ic name="check" size={20}/> Settings Saved!</>
          ):(
            <><Ic name="save" size={20}/> Save Settings</>
          )}
        </button>
      </div>
    </div>
  );
}

// ── PROFILE ──────────────────────────────────────────────────────────────────
function Profile(){
  const [form,setForm]=useState({name:'',age:'',weight:''});
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  
  useEffect(()=>{
    setForm(getProfile());
  },[]);

  const handleSave=()=>{
    setSaving(true);
    saveProfile(form);
    setTimeout(()=>{setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),3000);},400);
  };

  const inputCls="w-full border border-gray-200 rounded-2xl px-5 py-4 text-base font-bold focus:outline-none transition-all";
  const focusStyle={borderColor:'#10B981'};

  return(
    <div className="p-4 sm:p-5 lg:p-8 max-w-2xl mx-auto">
      <div className="slide-up mb-8">
        <h1 className="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Profile</h1>
        <p className="text-sm font-semibold text-gray-400 mt-1">Manage your personal details</p>
      </div>
      <div className="space-y-6">
        <div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden slide-up" style={{animationDelay:'0.05s'}}>
          <div className="flex flex-row items-center gap-3 px-5 sm:px-8 py-5 border-b border-gray-50 flex-nowrap">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style={{background:'#EFF6FF',color:'#2563EB'}}><Ic name="user" size={20}/></div>
            <div className="min-w-0">
              <h2 className="font-bold text-gray-900 text-base truncate">Personal Info</h2>
              <p className="text-xs font-semibold text-gray-400 mt-0.5 truncate">Used to personalize your dashboard</p>
            </div>
          </div>
          <div className="px-5 sm:px-8 py-6 space-y-5">
            <div>
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">Full Name</label>
              <input type="text" placeholder="e.g. Alex Tracker" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
                className={inputCls} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
            </div>
            <div className="grid grid-cols-2 gap-4 sm:gap-5">
              <div className="min-w-0">
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">Age</label>
                <div className="relative">
                  <input type="number" placeholder="25" value={form.age} onChange={e=>setForm(f=>({...f,age:e.target.value}))}
                    className={inputCls+" pr-12"} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-400 font-bold">yrs</span>
                </div>
              </div>
              <div className="min-w-0">
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block truncate">Base Weight</label>
                <div className="relative">
                  <input type="number" step="0.1" placeholder="75.0" value={form.weight} onChange={e=>setForm(f=>({...f,weight:e.target.value}))}
                    className={inputCls+" pr-12"} onFocus={e=>Object.assign(e.target.style,focusStyle)} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-400 font-bold">kg</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button onClick={handleSave} disabled={saving}
          className={`btn-primary w-full h-14 sm:h-16 rounded-2xl font-bold text-base sm:text-lg flex items-center justify-center gap-2 slide-up whitespace-nowrap`}
          style={{animationDelay:'0.1s',boxShadow:'0 8px 24px rgba(16,185,129,0.3)',background:saved?'#059669':''}}>
          {saving?(
            <><div style={{width:20,height:20,border:'2px solid rgba(255,255,255,0.4)',borderTop:'2px solid white',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/> Saving…</>
          ):saved?(
            <><Ic name="check" size={20}/> Profile Saved!</>
          ):(
            <><Ic name="save" size={20}/> Save Profile</>
          )}
        </button>
      </div>
    </div>
  );
}

// ── LAYOUT / APP ─────────────────────────────────────────────────────────────
const navItems=[
  {id:'dashboard',label:'Dashboard',icon:'home'},
  {id:'log',label:'Log Entries',icon:'list'},
  {id:'analytics',label:'Analytics',icon:'chart'},
  {id:'profile',label:'Profile',icon:'user'},
  {id:'settings',label:'Settings',icon:'settings'},
];

function App(){
  const [page,setPage]=useState('dashboard');
  const [subPage,setSubPage]=useState(null); // 'missedDays'

  const profile = getProfile();
  const displayUser = profile.name || 'Local User';
  const initial = displayUser.charAt(0).toUpperCase();

  const handleNav = (p) => { setSubPage(null); setPage(p); };

  return(
    <div style={{minHeight:'100vh',background:'#F8FAFB',display:'flex',fontFamily:"'Inter',sans-serif",overflowX:'hidden'}}>
      {/* Sidebar */}
      <aside className="sidebar" style={{width:256,background:'white',borderRight:'1px solid #F3F4F6',position:'fixed',top:0,bottom:0,left:0,zIndex:50,display:'flex',flexDirection:'column',boxShadow:'2px 0 12px rgba(0,0,0,0.04)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'24px',borderBottom:'1px solid #F9FAFB'}}>
          <div style={{width:36,height:36,borderRadius:12,background:'linear-gradient(135deg,#34D399,#059669)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(16,185,129,0.35)'}}>
            <Ic name="dumbbell" size={18} cls="text-white"/>
          </div>
          <span style={{fontWeight:800,fontSize:20,color:'#111827',letterSpacing:'-0.5px'}}>FitTrack</span>
        </div>
        <nav style={{flex:1,padding:'24px 12px',display:'flex',flexDirection:'column',gap:4}}>
          {navItems.map(({id,label,icon})=>{
            const active=page===id&&!subPage;
            return(
              <button key={id} onClick={()=>handleNav(id)}
                className={active?'nav-active':''}
                style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderRadius:16,fontSize:14,fontWeight:500,border:'none',cursor:'pointer',transition:'all 0.2s',textAlign:'left',width:'100%',background:active?'':'transparent',color:active?'white':'#6B7280'}}
                onMouseEnter={e=>{if(!active){e.currentTarget.style.background='#F9FAFB';e.currentTarget.style.color='#111827';}}}
                onMouseLeave={e=>{if(!active){e.currentTarget.style.background='transparent';e.currentTarget.style.color='#6B7280';}}}>
                <Ic name={icon} size={18}/>{label}
              </button>
            );
          })}
        </nav>
        <div style={{padding:'16px',borderTop:'1px solid #F9FAFB'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px',background:'#F9FAFB',borderRadius:16}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,#A78BFA,#7C3AED)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 8px rgba(124,58,237,0.3)',flexShrink:0}}>
              <span style={{color:'white',fontWeight:700,fontSize:14}}>{initial}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:13,fontWeight:700,color:'#111827',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{displayUser}</p>
              <p style={{fontSize:11,color:'#9CA3AF',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Data saved locally</p>
            </div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="main-content" style={{flex:1,marginLeft:256,minHeight:'100vh',width:'100vw'}}>
        {subPage === 'missedDays' ? (
          <MissedDaysPage onBack={() => { setSubPage(null); setPage('dashboard'); }} />
        ) : page === 'dashboard' ? (
          <Dashboard onNav={handleNav} onMissedDaysPage={() => setSubPage('missedDays')} />
        ) : page === 'log' ? (
          <LogEntries/>
        ) : page === 'analytics' ? (
          <Analytics/>
        ) : page === 'profile' ? (
          <Profile/>
        ) : page === 'settings' ? (
          <Settings/>
        ) : null}
      </main>

      {/* Mobile bottom nav */}
      <nav style={{display:'none',position:'fixed',bottom:0,left:0,right:0,background:'rgba(255,255,255,0.95)',backdropFilter:'blur(12px)',borderTop:'1px solid #F3F4F6',zIndex:40,height:80}}
        className="mobile-nav">
        {navItems.map(({id,label,icon})=>{
          const active=page===id&&!subPage;
          return(
            <button key={id} onClick={()=>handleNav(id)}
              style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5,border:'none',background:'transparent',cursor:'pointer',color:active?'#059669':'#9CA3AF',height:'100%',transition:'color 0.2s'}}>
              <div style={{padding:8,borderRadius:14,background:active?'#ECFDF5':'transparent',transition:'background 0.2s'}}>
                <Ic name={icon} size={24}/>
              </div>
              <span style={{fontSize:10,fontWeight:700}}>{label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
